<!DOCTYPE html>
<html>

<head>
    <title>Secret Diary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #333;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔒 Secret Diary</h1>

        <div class="card">
            <h2>Welcome to your private diary</h2>
            <p>Write your thoughts, memories and reflections in one secure place.</p>

            <a href="/admin/">Admin</a>
            <a href="/api/">API</a>
        </div>
    </div>
</body>

</html>
