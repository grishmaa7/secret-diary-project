<!DOCTYPE html>
<html>

<head>
    <title>My Diary</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #333;
        }

        .top-bar {
            margin: 20px 0;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-right: 10px;
        }

        .entry {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .entry h2 {
            margin-top: 0;
        }

        .mood {
            color: #666;
        }

        .date {
            color: #999;
            font-size: 14px;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📖 My Diary</h1>
        <a class="button" href="/entries/new/">➕ New Entry</a>
        <a class="button" href="/logout/">🚪 Logout</a>

        <div class="top-bar">
            <a class="button" href="/">← Home</a>
            <a class="button" href="/categories/">🏷️ Categories</a>
            <a class="button" href="/admin/">Admin</a>
        </div>

        {% for entry in entries %}

        <div class="entry">
            <h2>{{ entry.title }}</h2>

            <p>{{ entry.content }}</p>

            <p class="mood">
                Mood: {{ entry.mood }}
            </p>

            <p class="date">
                Created: {{ entry.created_at }}
            </p>
            
            <a class="button" href="/entries/{{ entry.id }}/edit/">✏️ Edit</a>
            <a class="button" href="/entries/{{ entry.id }}/delete/">🗑️ Delete</a>
            </div>

        {% empty %}

        <div class="empty">
            <h2>No diary entries yet 📝</h2>
            <p>Your diary is waiting for your first entry.</p>
        </div>

        {% endfor %}

    </div>

</body>

</html>
