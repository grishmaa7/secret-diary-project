<!DOCTYPE html>
<html>

<head>
    <title>Secret Diary</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #333;
            font-size: 42px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-top: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .buttons {
            margin-top: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-right: 10px;
        }

        a:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔒 Secret Diary</h1>

        <div class="card">
            <h2>Welcome to your private diary</h2>

            <p>
                Write your thoughts, memories and reflections
                in one secure place.
            </p>

            <div class="buttons">
                <a href="/entries/">My Diary</a>
                <a href="/admin/">Admin</a>
                <a href="/api/">API</a>
            </div>
        </div>

    </div>

</body>

</html>
