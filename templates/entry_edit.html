<!DOCTYPE html>
<html>

<head>
    <title>Edit Entry</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    {% include 'navbar.html' %}

    <div class="page-narrow">

        <div class="page-header">
            <h1>✏️ Edit Entry</h1>
            <p>Update your thoughts anytime.</p>
        </div>

        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{ entry.title }}" required>

                <label for="content">What's on your mind?</label>
                <textarea id="content" name="content" required>{{ entry.content }}</textarea>

                <label for="mood">Mood</label>
                <select id="mood" name="mood">
                    <option value="happy" {% if entry.mood == 'happy' %}selected{% endif %}>😊 Happy</option>
                    <option value="sad" {% if entry.mood == 'sad' %}selected{% endif %}>😢 Sad</option>
                    <option value="neutral" {% if entry.mood == 'neutral' %}selected{% endif %}>😐 Neutral</option>
                    <option value="anxious" {% if entry.mood == 'anxious' %}selected{% endif %}>😰 Anxious</option>
                    <option value="excited" {% if entry.mood == 'excited' %}selected{% endif %}>🤩 Excited</option>
                </select>

                <label for="category">Category</label>
                <select id="category" name="category">
                    {% for category in categories %}
                    <option value="{{ category.id }}" {% if entry.category_id == category.id %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                    {% endfor %}
                </select>

                <div class="form-actions">
                    <a class="button button-soft" href="/entries/">← Cancel</a>
                    <button type="submit">Save Changes</button>
                </div>

            </form>

        </div>

    </div>
{% include 'footer.html' %}
</body>

</html>
