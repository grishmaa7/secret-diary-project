<!DOCTYPE html>
<html>

<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>New Category</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        .back {
            background: #777;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    {% include 'navbar.html' %}

    <div class="container">

        <h1>🏷️ New Category</h1>

        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Travel, Work, Family" required>

                <label for="description">Description</label>
                <textarea id="description" name="description"
                    placeholder="Optional notes about this category"></textarea>

                <br>

                <a class="button back" href="/categories/">← Back</a>

                <button class="button" type="submit">
                    Save Category
                </button>

            </form>

        </div>

    </div>

</body>

</html>
