<!DOCTYPE html>
<html>

<head>
    <title>New Category</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    {% include 'navbar.html' %}

    <div class="page-narrow">

        <div class="page-header">
            <h1>🏷️ New Category</h1>
            <p>Give your entries a home.</p>
        </div>

        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Travel, Work, Family" required>

                <label for="description">Description</label>
                <textarea id="description" name="description"
                    placeholder="Optional notes about this category"></textarea>

                <div class="form-actions">
                    <a class="button button-soft" href="/categories/">← Back</a>
                    <button type="submit">Save Category</button>
                </div>

            </form>

        </div>

    </div>

</body>

</html>
