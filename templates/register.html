<!DOCTYPE html>
<html>

<head>
    <title>Register - Secret Diary</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    {% include 'navbar.html' %}

    <div class="page-narrow">

        <div class="form-card" style="max-width: 420px; margin: 40px auto;">

            <h1 style="margin-bottom: 20px;">🔒 Create Your Diary Account</h1>

            {% if error %}
            <p style="color: #d64545; font-weight: 600;">{{ error }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label>Username</label>
                <input type="text" name="username" required>

                <label>Password</label>
                <input type="password" name="password" required>

                <label>Confirm Password</label>
                <input type="password" name="password2" required>

                <div class="form-actions">
                    <button type="submit">Create Account</button>
                </div>
            </form>

            <p style="margin-top: 20px; font-size: 14px;">
                Already have an account?
                <a href="/login/" style="color: var(--pink); font-weight: 600;">Login</a>
            </p>

        </div>

    </div>
{% include 'footer.html' %}
</body>

</html>
