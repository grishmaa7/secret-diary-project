<!DOCTYPE html>
<html>

<head>
    <title>Register - Secret Diary</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button,
        a {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .error {
            color: #b00020;
            margin-bottom: 15px;
        }

        .link {
            background: none;
            color: #333;
            padding-left: 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🔒 Create Your Diary Account</h1>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label>Username</label>
                <input type="text" name="username" required>

                <label>Password</label>
                <input type="password" name="password" required>

                <label>Confirm Password</label>
                <input type="password" name="password2" required>

                <button type="submit">Create Account</button>
            </form>

            <p>
                Already have an account?
                <a class="link" href="/login/">Login</a>
            </p>

        </div>

    </div>

</body>

</html>
